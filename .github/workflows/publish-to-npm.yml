# Publishes to npm using trusted publishing (OIDC), so no NPM_TOKEN is required.
# https://docs.npmjs.com/trusted-publishers
#
# One-time setup on npmjs.com (Package settings > Trusted publisher):
#   Publisher:        GitHub Actions
#   Organization:     patik
#   Repository:       inquirer-form-prompt
#   Workflow:         publish-to-npm.yml
#   Environment:      (leave empty)
# Renaming or moving this file will break publishing until the trusted publisher
# config on npmjs.com is updated to match.

name: Publish to NPM

on:
    push:
        tags:
            # Only publish on version tags like v1.2.3
            # git tag v1.2.3 && git push origin v1.2.3
            # git tag -d v1.2.3 && git push origin :refs/tags/v1.2.3
            - 'v*.*.*' # Only publish on version tags like v1.2.3

permissions:
    contents: read
    id-token: write # Required for trusted publishing; also generates provenance

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10
                  run_install: false

            # `registry-url` is deliberately omitted: it makes setup-node write
            # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and with no token set
            # npm treats that empty line as "auth is already configured" and never starts the OIDC
            # exchange, failing with ENEEDAUTH. https://github.com/actions/setup-node/issues/1551
            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: '.nvmrc'
                  cache: 'pnpm'

            # Trusted publishing needs npm 11.5.1+, which is newer than the npm bundled with Node
            - name: Upgrade npm
              run: npm install --global npm@latest

            - name: Install dependencies
              run: pnpm install

            - name: Build
              run: pnpm run ci

            # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for a short-lived
            # publish token on its own
            - name: Publish to NPM
              run: npm publish --access public
