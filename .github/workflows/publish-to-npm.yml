# Publishes to npm using trusted publishing (OIDC), so no NPM_TOKEN is required.
# https://docs.npmjs.com/trusted-publishers
#
# One-time setup on npmjs.com (Package settings > Trusted publisher):
#   Publisher:        GitHub Actions
#   Organization:     patik
#   Repository:       inquirer-form-prompt
#   Workflow:         publish-to-npm.yml
#   Environment:      (leave empty)
# Renaming or moving this file will break publishing until the trusted publisher
# config on npmjs.com is updated to match.

name: Publish to NPM

on:
    push:
        tags:
            # Only publish on version tags like v1.2.3
            # git tag v1.2.3 && git push origin v1.2.3
            # git tag -d v1.2.3 && git push origin :refs/tags/v1.2.3
            - 'v*.*.*' # Only publish on version tags like v1.2.3

permissions:
    contents: read
    id-token: write # Required for trusted publishing; also generates provenance

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # node@24 rather than the 22 the library floor allows: recent npm releases
            # require `^22.22.2 || ^24.15.0 || >=26.0.0`, so Node 22 only barely satisfies
            # npm@latest and would break the next time npm raises that floor. This job only
            # builds and publishes; the 22.x support matrix is covered by lint-and-tests.yml.
            - name: Set up pnpm and Node.js
              uses: pnpm/setup@v2
              with:
                  runtime: node@24
                  cache: true

            # Trusted publishing needs npm 11.5.1+, and the npm bundled with Node is older
            # than that. `pnpm/setup` runs `pnpm runtime set node ... -g`, which puts Node and
            # its bundled npm in $PNPM_HOME at the front of PATH, so a plain
            # `npm install --global` installs behind $PNPM_HOME and never wins. Install into a
            # prefix we control and put that prefix first instead.
            - name: Install npm for publishing
              run: |
                  npm install --global --prefix "$RUNNER_TEMP/npm" npm@latest
                  echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"

            # Confirm the npm we just installed is the one later steps will actually run.
            # Fail here rather than at publish time.
            - name: Verify npm version
              run: |
                  version="$(npm --version)"
                  echo "npm $version"
                  node -e 'const [a, b, c] = process.argv[1].split(".").map(Number)
                    if (a * 1e6 + b * 1e3 + c < 11 * 1e6 + 5 * 1e3 + 1) {
                        console.error(`npm ${process.argv[1]} is too old; trusted publishing needs >= 11.5.1`)
                        process.exit(1)
                    }' "$version"

            # Runs build + check-format + check-exports + tests. A tag must never publish
            # a version whose test suite is failing.
            - name: Build and test
              run: pnpm run ci

            # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for a short-lived
            # publish token on its own
            - name: Publish to NPM
              run: npm publish --access public
